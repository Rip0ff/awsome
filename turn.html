<!DOCTYPE html>

    <body>
        <header>

        <main>
            <div id="body">

                </div>
            </div>
        </main>

        <footer>
            <form id="updateInit">
                <div class="layout">
                    <div id="foot" class="scroll-container">
                        <div class="scroll-item" id="0">

                        </div>
                    </div>
                    <button type="submit">Add rolls</button>
                </div>
            </form>
        </footer>
